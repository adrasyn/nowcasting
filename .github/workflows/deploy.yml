name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/simple/**"
      - "scripts/check_deployed.py"
      - "tests/**"
      - "playwright.config.ts"
      - "vitest.config.ts"
      - "requirements-simple.txt"
      - "data/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event.pull_request.number || 'production' }}"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python for static GIF generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-simple.txt

      - name: Install simple-page build dependency
        run: python -m pip install -r requirements-simple.txt

      - name: Test site data contracts
        run: npm test

      - name: Test simple-page generation
        run: python -m unittest discover -s scripts/simple -p 'test_*.py'

      - name: Test ANZ monthly refresh guards
        run: python -m unittest discover -s nowcasting_v2/scrapers -p 'test_anz_monthly.py'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Save browser QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: test-results
          retention-days: 7
          if-no-files-found: warn

      - name: Build Next.js static site
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4

      - name: Verify fresh public homepage and simple page
        if: github.event_name != 'pull_request'
        run: python scripts/check_deployed.py --base https://nowcast.wlsn.me/ --commit "$GITHUB_SHA" --attempts 12

      - name: Verify public evolution legend in Chromium and iPhone WebKit
        if: github.event_name != 'pull_request'
        env:
          NOWCAST_PUBLIC_BASE_URL: https://nowcast.wlsn.me/
          NOWCAST_EXPECTED_COMMIT: ${{ github.sha }}
        run: npx playwright test tests/evolution-legend.spec.ts

      - name: Save public legend QA captures
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: public-legend-qa
          path: test-results
          retention-days: 7
          if-no-files-found: warn
