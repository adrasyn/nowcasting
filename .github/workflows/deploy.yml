name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/simple/**'
      - 'scripts/ci/**'
      - 'scripts/check_deployed.py'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'vitest.config.ts'
      - 'requirements-simple.txt'
      - 'data/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
      - '.github/actions/browser-qa/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification:
        description: 'auto: fast only when code matches the published build; full: all browser checks'
        type: choice
        options: [auto, full]
        default: auto

# Existing permissions retained. No cross-run artifact/API credentials.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      full_qa: ${{ steps.plan.outputs.full_qa }}
      publish: ${{ steps.plan.outputs.publish }}
      artifact_id: ${{ steps.artifact.outputs['artifact-id'] }}
    env:
      NOWCAST_FIXTURE_DIR: ci-artifact/fixtures
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          filter: blob:none
      - name: Choose coverage from the published baseline
        id: plan
        env:
          VERIFICATION: ${{ inputs.verification || 'auto' }}
        run: python3 scripts/ci/workflow_policy.py plan
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-simple.txt
      - run: python -m pip install -r requirements-simple.txt
      - name: Preserve unit, data, rollover and generation guards
        run: |
          mkdir -p ci-artifact/fixtures
          npm test
          python -m unittest discover -s scripts/simple -p 'test_*.py'
          python -m unittest discover -s nowcasting_v2/scrapers -p 'test_anz_monthly.py'
          python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Build this candidate once
        run: npm run build
      - name: Fingerprint the export and guarded fixtures
        run: python scripts/ci/candidate.py create --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
      - name: Install Chromium only for publishing smoke
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the exact export
        env:
          NOWCAST_PREBUILT: '1'
          NOWCAST_EXPECTED_COMMIT: ${{ github.sha }}
        run: npx playwright test --project=deployment-smoke --workers=1
      - name: Confirm smoke did not change the export
        run: python scripts/ci/candidate.py verify --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
      - name: Share this run's immutable candidate
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/
            ci-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7

  chromium:
    needs: candidate
    if: needs.candidate.outputs.full_qa == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-qa
        with:
          project: chromium
          artifact_id: ${{ needs.candidate.outputs.artifact_id }}

  webkit:
    needs: candidate
    if: needs.candidate.outputs.full_qa == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Exact match to package-lock.json; browsers and OS dependencies are baked in.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser-qa
        with:
          project: webkit-iphone
          artifact_id: ${{ needs.candidate.outputs.artifact_id }}

  # Keep the existing check name and fail explicitly if required QA was skipped.
  deploy:
    needs: [candidate, chromium, webkit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Enforce required coverage
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/workflow_policy.py gate
      - name: Retrieve this production candidate
        if: success() && needs.candidate.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          merge-multiple: true
      - name: Verify exact candidate identity and bytes
        if: success() && needs.candidate.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        run: python3 scripts/ci/candidate.py verify --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
      - name: Upload the smoke-tested export to Pages
        id: pages_upload
        if: success() && needs.candidate.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
      # Upload completion can precede artifact registration. Pages searches
      # its own Actions index by name; don't immediately call it after upload.
      - name: Wait for this run's Pages artifact
        if: success() && needs.candidate.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        timeout-minutes: 2
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact_id }}
          ARTIFACT_NAME: pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const name = process.env.ARTIFACT_NAME;
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error(`Upload didn't return an artifact ID for ${name}`);
            }
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 10; attempt++) {
              let artifacts = [];
              try {
                ({ data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
                  ...context.repo, run_id: context.runId, name
                }));
              } catch (error) {
                if (![404, 429, 500, 502, 503, 504].includes(error.status)) throw error;
                core.info(`Artifact lookup returned ${error.status}; waiting`);
              }
              if (artifacts.some(a => a.id === artifactId && a.name === name && !a.expired)) {
                core.info(`Found ${name} (artifact ${artifactId}); allowing the Pages index to catch up`);
                await wait(12000);
                return;
              }
              if (attempt < 10) await wait(5000);
            }
            throw new Error(`Artifact ${artifactId} (${name}) never registered for this run`);
      - name: Deploy to GitHub Pages
        if: success() && needs.candidate.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify live build, routes and exact export bytes
        if: success() && needs.candidate.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        run: python3 scripts/check_deployed.py --base https://nowcast.wlsn.me/ --commit "$GITHUB_SHA" --manifest ci-artifact/manifest.json --attempts 12
