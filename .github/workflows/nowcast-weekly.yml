name: Weekly Nowcast

on:
  schedule:
    # 19:00 UTC SUNDAY = 05:00 AEST Monday (06:00 AEDT during daylight saving).
    # The whole Monday sequence -- this job, the v3 job at 20:30 UTC, the
    # combination and the deploy -- has to be finished before 9 am Sydney, so
    # the v2 half starts first and the v3 half follows it. The run is Sunday in
    # UTC and Monday in Sydney, which is why the job sets TZ below: R's
    # Sys.Date() has to see the Monday or emit_v2_json.R computes last week's
    # vintage.
    # It no longer waits behind Monday's 11:30 AEST ABS release window: those
    # drops are picked up by the following week's run, and a published figure
    # before the working day starts is worth more than half a day of freshness.
    - cron: "0 19 * * 0"
    # Tuesday 21:00 UTC in Mar/Jun/Sep/Dec — gated below so it only actually runs
    # when tomorrow is the first Wednesday of the month (i.e. the ABS GDP release day).
    - cron: "0 21 * 3,6,9,12 2"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: nowcast-weekly
  cancel-in-progress: false

jobs:
  # NO TZ HERE, DELIBERATELY. This gate reads `date -u -d "tomorrow"` to decide
  # whether tomorrow is the first Wednesday of the month, and the 21:00 UTC
  # Tuesday cron it gates is already the evening before a Sydney release
  # morning. Give this job Sydney time and "tomorrow" lands a day late.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$TRIGGER_SCHEDULE" != "0 21 * 3,6,9,12 2" ]; then
            # Manual dispatch or the weekly Sunday cron — always run.
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tomorrow_dom=$(date -u -d "tomorrow" +%d)
          tomorrow_dow=$(date -u -d "tomorrow" +%u)
          if [ "$tomorrow_dow" = "3" ] && [ "$tomorrow_dom" -le 7 ]; then
            echo "Tomorrow is the first Wednesday — running pre-release nowcast."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the day before a GDP release (tomorrow dow=$tomorrow_dow dom=$tomorrow_dom). Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  nowcast:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # THE JOB'S "TODAY" IS SYDNEY'S. The cron fires 19:00 UTC Sunday, which is
      # Monday morning in Sydney, and `emit_v2_json.R` builds its vintage list
      # from the latest Monday at or before Sys.Date(). With a UTC clock that
      # date is Sunday and the run re-emits LAST week's vintage. R honours TZ on
      # Windows as well as on Linux (Sys.Date() reads the local zone), so this
      # one variable is enough; `date -u` calls in the run blocks below are
      # explicitly UTC and are unaffected.
      TZ: Australia/Sydney
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # setup-r downloads R + Ghostscript from external mirrors; a transient 504
      # there killed the 2026-06-08 run and staled the site for a week (issue #12).
      # Attempt once tolerantly, then retry — a uses: step can't be wrapped in a
      # retry action, so we use continue-on-error + a conditional re-run.
      - name: Set up R (attempt 1)
        id: setupr1
        uses: r-lib/actions/setup-r@v2
        continue-on-error: true
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Set up R (retry)
        if: steps.setupr1.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Restore R packages (renv)
        env:
          # Windows R uses a User-Agent-aware CRAN mirror; no __linux__ prefix.
          RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/latest
        # Run from repo root (no .Rprofile) so pipeline/.Rprofile doesn't auto-source
        # renv/activate.R. Multi-line Rscript -e strings segfault on Windows under
        # Git Bash (CRLF line endings corrupt the parsed expression), so everything
        # goes on one line. Prepend the pipeline renv library to .libPaths() so
        # restore writes there — otherwise packages land in system lib and the
        # pipeline step (which activates renv via pipeline/.Rprofile) can't see them.
        # Retry the restore — CRAN/posit mirrors occasionally 5xx; a single
        # transient failure here should not stale the site for a week. The
        # Rscript stays on ONE line (multi-line -e segfaults on Windows Git Bash).
        run: |
          for attempt in 1 2 3; do
            Rscript -e 'options(repos = c(CRAN = Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"))); if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv"); lib <- renv::paths$library(project = "pipeline"); dir.create(lib, recursive = TRUE, showWarnings = FALSE); .libPaths(c(lib, .libPaths())); lock <- renv::lockfile_read("pipeline/renv.lock"); pkgs <- setdiff(names(lock$Packages), "renv"); renv::restore(project = "pipeline", packages = pkgs, prompt = FALSE)' && exit 0
            echo "renv restore attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          echo "renv restore failed after 3 attempts"
          exit 1

      - name: Verify all locked packages installed
        # Check the pipeline renv library on the search path — same lib the pipeline
        # step will see — not whatever happens to be in system lib.
        run: Rscript -e 'lib <- renv::paths$library(project = "pipeline"); .libPaths(c(lib, .libPaths())); lock <- renv::lockfile_read("pipeline/renv.lock"); pkgs <- setdiff(names(lock$Packages), "renv"); ok <- vapply(pkgs, requireNamespace, logical(1), quietly = TRUE); if (!all(ok)) { cat("MISSING:", paste(pkgs[!ok], collapse = ", "), "\n"); quit(status = 1) }'

      - name: Run nowcast pipeline
        id: nowcast
        working-directory: pipeline
        run: Rscript run_complete_nowcast.R

      # v2 (RBA MAI + MIDAS). RBA/ABS are gov sources (no WAF) and the emit is the
      # v2 model itself, so both belong here in the R cron, NOT on the laptop. The
      # WAF-blocked surveys (NAB/ANZ/Westpac) are refreshed separately by the local
      # Cowork task; this step just reads whatever data_raw CSVs are present.
      # continue-on-error so a transient v2 issue can't block the v1 commit/deploy
      # (if v2 fails the prior data/latest_v2.json is still served — stale, not
      # broken). The fetchers now exit non-zero on any failed series (fail-loud),
      # so a data outage aborts this step before emit instead of nowcasting on
      # stale data — and the dedicated "Alert on v2 failure" step below fires.
      - name: Refresh v2 panel + nowcast (RBA/ABS data + emit)
        id: v2
        if: success()
        continue-on-error: true
        working-directory: nowcasting_v2
        env:
          # v2 scripts source R/_setup.R (prepends the pipeline renv library); set
          # R_LIBS too so rlang >= 1.1.7 from renv wins over any base copy.
          R_LIBS: ${{ github.workspace }}/pipeline/renv/library/windows/R-4.5/x86_64-w64-mingw32
        run: |
          Rscript R/fetch/fetch_rba_panel.R
          Rscript R/fetch/fetch_abs_panel.R
          # GDP regressand + target-quarter driver for the v2 model — must refresh
          # or v2 keeps targeting a superseded quarter. Since 2026-09 it reads the
          # first-release series maintained by the v3 pipeline
          # (nowcasting_v3/data/gdp_first_release.csv, in this same checkout) and
          # tops it up from the live ABS fetch. This step runs at 19:00 UTC Sunday
          # and the v3 job that appends a new print runs at 20:30, so on a print
          # Monday the top-up is what supplies the just-printed quarter.
          Rscript R/fetch_rt_gdp.R
          Rscript R/emit_v2_json.R
          # Refresh the indicator-grid display (data/indicators_v2.json) from the
          # freshly-fetched data_raw. Python stdlib only; reads data_raw, so it
          # picks up both the RBA/ABS fetch above and the survey commits on main.
          python gen_indicators_v2.py
          # Refresh the v2 track record (data/performance_v2.json) so a newly
          # released GDP actual (now in data/gdp.json from the v1 pipeline above)
          # is scored for any quarter that already has a backcast. NB: brand-new
          # quarters need the v2 backtest re-run to gain a backcast (separate job).
          python gen_performance_v2.py

      # The v2 step is continue-on-error so it can't stale the live v1 site; surface
      # its failure loudly here instead (the job-level "Alert on failure" never
      # fires for a continue-on-error step).
      - name: Alert on v2 failure
        if: steps.v2.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "v2-failure",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `v2 refresh failed again ${today}. The live site is serving the prior latest_v2.json (stale, not broken). Logs: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `v2 nowcast refresh failed ${today}`,
                body: `The v2 step (fetch/emit/indicators) failed; v1 still shipped. Site serves the prior latest_v2.json (stale). Logs: ${runUrl}`,
                labels: ["v2-failure"], assignees: [context.repo.owner],
              });
            }

      - name: Commit updated JSON and vintage index
        id: commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git add nowcasting_v2/data_raw/
          git add pipeline/.cache/model_output/vintages/vintage_tracking.csv
          # `03d_sync_nab_from_v2.R` derives this file from the v2 scrape on
          # EVERY run (added 2026-08-23 to fix the stale-v1 failures of #16).
          # It is tracked, it was never added here, so from 2026-08-24 the tree
          # was dirty at the rebase below and the job died three weeks running.
          # The fix for the first failure caused the second.
          git add pipeline/nab_business_confidence_raw.csv
          if git diff --staged --quiet; then
            echo "No JSON changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Local date, and TZ is Sydney: the commit is labelled with the
          # Monday vintage it carries, not the Sunday it fired in UTC.
          git commit -m "data: weekly nowcast $(date +%Y-%m-%d)"
          # Name whatever is still dirty BEFORE the rebase. The failure this
          # replaces said only "You have unstaged changes" and cost a diagnosis
          # to turn into a filename; the next one should say it outright.
          echo "--- working tree before rebase ---"
          git status --porcelain
          # --autostash so that a tracked file some future pipeline step rewrites,
          # and nobody remembers to add, cannot take the whole weekly job down
          # again. The three-week outage above is the argument for the flag.
          git pull --rebase --autostash origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            // Dedupe WITHIN THIS PIPELINE, not across the label. Both weekly
            // jobs use `pipeline-failure`, and this handler used to take
            // `existing.data[0]` — any open issue with the label. Once v3 began
            // running weekly that meant a v2 failure could post "Failed again"
            // into an open V3 thread, naming no pipeline, and never open an
            // issue of its own. v2 is not on the homepage after #22, so nobody
            // would be looking at /v2 to notice. The v3 handler already matches
            // on its own title; this is the same rule from the other side.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pipeline-failure",
            });
            const open = existing.data.find(
              (i) => !i.title.toLowerCase().includes("v3"));
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `The v2 weekly nowcast failed again ${today} (after ` +
                      `in-step retries). Logs: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Weekly nowcast failed ${today}`,
                body: `The v2 weekly nowcast pipeline failed after in-step ` +
                      `retries. See logs: ${runUrl}\n\nThis does not affect ` +
                      `the published v3 nowcast — the two run in separate ` +
                      `workflows for that reason.`,
                labels: ["pipeline-failure"],
                assignees: [context.repo.owner],
              });
            }
