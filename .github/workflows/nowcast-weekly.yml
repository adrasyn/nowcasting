name: Weekly Nowcast

on:
  schedule:
    # 02:00 UTC Monday = 12:00 AEST Monday (13:00 AEDT during daylight savings).
    # Sits ~30 min after the 11:30 AEST ABS release window so Monday's drops
    # (e.g. Building Approvals) get ingested in the same run.
    - cron: "0 2 * * 1"
    # Tuesday 21:00 UTC in Mar/Jun/Sep/Dec — gated below so it only actually runs
    # when tomorrow is the first Wednesday of the month (i.e. the ABS GDP release day).
    - cron: "0 21 * 3,6,9,12 2"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: nowcast-weekly
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$TRIGGER_SCHEDULE" != "0 21 * 3,6,9,12 2" ]; then
            # Manual dispatch or the weekly Sunday cron — always run.
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tomorrow_dom=$(date -u -d "tomorrow" +%d)
          tomorrow_dow=$(date -u -d "tomorrow" +%u)
          if [ "$tomorrow_dow" = "3" ] && [ "$tomorrow_dom" -le 7 ]; then
            echo "Tomorrow is the first Wednesday — running pre-release nowcast."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the day before a GDP release (tomorrow dow=$tomorrow_dow dom=$tomorrow_dom). Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  nowcast:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # setup-r downloads R + Ghostscript from external mirrors; a transient 504
      # there killed the 2026-06-08 run and staled the site for a week (issue #12).
      # Attempt once tolerantly, then retry — a uses: step can't be wrapped in a
      # retry action, so we use continue-on-error + a conditional re-run.
      - name: Set up R (attempt 1)
        id: setupr1
        uses: r-lib/actions/setup-r@v2
        continue-on-error: true
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Set up R (retry)
        if: steps.setupr1.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Restore R packages (renv)
        env:
          # Windows R uses a User-Agent-aware CRAN mirror; no __linux__ prefix.
          RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/latest
        # Run from repo root (no .Rprofile) so pipeline/.Rprofile doesn't auto-source
        # renv/activate.R. Multi-line Rscript -e strings segfault on Windows under
        # Git Bash (CRLF line endings corrupt the parsed expression), so everything
        # goes on one line. Prepend the pipeline renv library to .libPaths() so
        # restore writes there — otherwise packages land in system lib and the
        # pipeline step (which activates renv via pipeline/.Rprofile) can't see them.
        # Retry the restore — CRAN/posit mirrors occasionally 5xx; a single
        # transient failure here should not stale the site for a week. The
        # Rscript stays on ONE line (multi-line -e segfaults on Windows Git Bash).
        run: |
          for attempt in 1 2 3; do
            Rscript -e 'options(repos = c(CRAN = Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"))); if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv"); lib <- renv::paths$library(project = "pipeline"); dir.create(lib, recursive = TRUE, showWarnings = FALSE); .libPaths(c(lib, .libPaths())); lock <- renv::lockfile_read("pipeline/renv.lock"); pkgs <- setdiff(names(lock$Packages), "renv"); renv::restore(project = "pipeline", packages = pkgs, prompt = FALSE)' && exit 0
            echo "renv restore attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          echo "renv restore failed after 3 attempts"
          exit 1

      - name: Verify all locked packages installed
        # Check the pipeline renv library on the search path — same lib the pipeline
        # step will see — not whatever happens to be in system lib.
        run: Rscript -e 'lib <- renv::paths$library(project = "pipeline"); .libPaths(c(lib, .libPaths())); lock <- renv::lockfile_read("pipeline/renv.lock"); pkgs <- setdiff(names(lock$Packages), "renv"); ok <- vapply(pkgs, requireNamespace, logical(1), quietly = TRUE); if (!all(ok)) { cat("MISSING:", paste(pkgs[!ok], collapse = ", "), "\n"); quit(status = 1) }'

      - name: Run nowcast pipeline
        id: nowcast
        working-directory: pipeline
        run: Rscript run_complete_nowcast.R

      - name: Commit updated JSON and vintage index
        id: commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git add pipeline/.cache/model_output/vintages/vintage_tracking.csv
          if git diff --staged --quiet; then
            echo "No JSON changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: weekly nowcast $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            // Dedupe: if an open pipeline-failure issue already exists, comment on
            // it instead of stacking duplicates; otherwise open one and ASSIGN the
            // owner so GitHub actually notifies (the prior design's bare issue went
            // unactioned for days).
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pipeline-failure",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Failed again ${today} (after in-step retries). Logs: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Weekly nowcast failed ${today}`,
                body: `The weekly nowcast pipeline failed after in-step retries. See logs: ${runUrl}`,
                labels: ["pipeline-failure"],
                assignees: [context.repo.owner],
              });
            }
